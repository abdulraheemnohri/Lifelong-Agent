name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee "pytest_output_py${{ matrix.python-version }}.txt"

      - name: Error-level lint
        run: ruff check --select E9,F --exit-zero .

      - name: Publish test log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "ci-logs-py${{ matrix.python-version }}"
          git add -f "pytest_output_py${{ matrix.python-version }}.txt"
          git commit -m "ci: publish pytest failure log (py${{ matrix.python-version }})"
          git push origin "ci-logs-py${{ matrix.python-version }}" --force
